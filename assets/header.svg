<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Abdul Sattar Maher</title>
  <desc id="desc">Full Stack Developer, AI and Automation. Building practical web apps, business software and AI-powered automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#131B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.45"/>
    <circle cx="980" cy="40" r="260" fill="url(#glowCyan)"/>
    <circle cx="1120" cy="300" r="240" fill="url(#glowViolet)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#1E293B"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="92" fill="#22D3EE" font-size="15" font-weight="600" letter-spacing="3.5">HI, I'M</text>
    <text x="64" y="148" fill="#F1F5F9" font-size="50" font-weight="700" letter-spacing="-0.5">Abdul Sattar Maher</text>
    <text x="64" y="192" fill="url(#accent)" font-size="24" font-weight="600">Full Stack Developer · AI &amp; Automation</text>
    <text x="64" y="232" fill="#94A3B8" font-size="17">Building practical web apps, business software</text>
    <text x="64" y="256" fill="#94A3B8" font-size="17">and AI-powered automation.</text>
  </g>

  <!-- code window -->
  <g transform="translate(728 62)">
    <rect width="408" height="196" rx="14" fill="#0B1220" fill-opacity="0.85" stroke="#26324A"/>
    <circle cx="22" cy="22" r="5" fill="#F87171"/>
    <circle cx="40" cy="22" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="22" r="5" fill="#34D399"/>
    <text x="388" y="27" text-anchor="end" fill="#475569" font-size="12" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace">developer.js</text>
    <line x1="0" y1="42" x2="408" y2="42" stroke="#1E293B"/>
    <g font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15">
      <text x="22" y="74"><tspan fill="#A78BFA">const</tspan><tspan fill="#E2E8F0"> developer = {</tspan></text>
      <text x="42" y="100"><tspan fill="#7DD3FC">role</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">"Full Stack"</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="42" y="126"><tspan fill="#7DD3FC">stack</tspan><tspan fill="#E2E8F0">: [</tspan><tspan fill="#86EFAC">"React"</tspan><tspan fill="#E2E8F0">, </tspan><tspan fill="#86EFAC">"Node"</tspan><tspan fill="#E2E8F0">, </tspan><tspan fill="#86EFAC">"SQL"</tspan><tspan fill="#E2E8F0">],</tspan></text>
      <text x="42" y="152"><tspan fill="#7DD3FC">focus</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">"AI &amp; Automation"</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="42" y="178"><tspan fill="#7DD3FC">at</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">"Parix.AI"</tspan><tspan fill="#E2E8F0"> };</tspan></text>
    </g>
  </g>
</svg>
